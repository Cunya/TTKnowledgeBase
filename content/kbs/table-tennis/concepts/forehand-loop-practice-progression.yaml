id: concept-forehand-loop-practice-progression
slug: forehand-loop-practice-progression
label: Practice intensity, timing and coordination
aliases:
- reduced-power practice
- timing and coordination drills
short_definition: Exercises for reduced-power practice, arm-and-body coordination, contact timing and variable feeds. Some examples specifically concern loops; others use shadow practice or varied topspin-rally feeds.
evidence_summary: >-
  The rally-practice advice uses 30–40% power before an amateur’s technique and structure are stable. Another cue coordinates arm and body, then uses shadow practice without hitting before ball training. A timing drill alternates the rise and start of descent; a topspin rally drill asks partners or robots to vary speed, height and tempo and partners to provide awkward placements rather than perfect feeds.
detailed_definition: In one fixed-point drill, a partner blocks with either forehand or backhand and the learner uses about 40–50% strength without standing too close. Another lesson recommends 30–40% power for amateurs before technique and structure are stable. A shadow-practice cue first coordinates arm and body, then uses racket swings without hitting before ball training. Separate drills alternate rising and early-descending contact or vary feed speed, height, pace and placement.
concept_type: drill
facets:
  category:
  - practice
  spin:
  - topspin
difficulty:
review_status: approved
