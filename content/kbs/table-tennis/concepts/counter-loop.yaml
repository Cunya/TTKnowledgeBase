id: concept-counter-loop
slug: counter-loop
label: Counter-loop
aliases:
- counterloop
short_definition: A stroke called a “forward spin shot” in one lesson, with separate source-specific examples of incoming-ball selection, loop rhythm and extended-rally strategy.
evidence_summary: >-
  One lesson describes counter-loop force from back to front and contrasts it with lower-right-to-upper-left force for what it calls a topspin loop. Another chooses counter-loop for a high, slow, low-quality incoming ball and topspin for a low, fast ball. Related loop-rhythm cues compare the rhythm with backspin, suggest room about a meter from the table and a clear pause, and say to slow down against topspin to avoid rushing. A forehand timing example waits for rhythm to allow waist, hips and arm to combine. A strategy example recommends extended counter-looping rallies for a physically strong, solid player.
concept_type: stroke
facets:
  category:
  - stroke
difficulty:
review_status: approved
