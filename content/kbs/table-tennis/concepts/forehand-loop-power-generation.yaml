id: concept-forehand-loop-power-generation
slug: forehand-loop-power-generation
label: Forehand loop power generation
aliases:
- loop power
- body-led loop
- drive-snap rhythm
short_definition: Generate forehand-loop power through racket-head motion, with
  loop lessons also describing body-led preparation and acceleration.
evidence_summary: >-
  Examples include body-led preparation, a drop-drive-brake sequence, acceleration
  paired with braking, and forehand-loop racket-head motion. After a no-spin serve
  returns half-long and slightly high, one lesson permits a power loop; its high-ball
  example uses mainly impact with brushing as a supplement. Another loop-power example
  uses friction followed by forward force while standing still without body power.
detailed_definition: 'One lesson explicitly calls the body-led action a loop: open
  the arm, let body rotation lead the backswing while the hand stays in front, then
  accelerate. Another lesson drops down, drives forward and brakes the arm, calling
  forward drive essential when looping. A separate loop-power example uses friction
  followed by forward force while standing still without using the body.'
concept_type: principle
facets:
  category:
  - stroke
  side:
  - forehand
  spin:
  - topspin
difficulty:
review_status: approved
