id: concept-block-trajectory-and-placement
slug: block-trajectory-and-placement
label: Trajectory choices against loops and blocks
aliases:
- trajectory control
short_definition: To make the opponent's loop slower, keep the trajectory low; this kind of ball limits the opponent's power. At mid distance, a high-arcing loop with a shorter trajectory is harder to block because the contact point is over the table.
evidence_summary: >-
  The speaker says that keeping the trajectory low makes the opponent's loop slower and that this kind of ball prevents the opponent from generating power. The speaker also says, “No matter how spinny the serve is, a high arc won't work. Keep it lower.” In a spoken example, the speaker says, “I'll give you a low arc ball. Try to power loop,” then says, “Into the net,” and adds that only high-arc balls make you consider attacking. At mid distance, the speaker recommends a high-arcing loop with a shorter trajectory because the contact point is over the table, making it hard for the opponent to block.
concept_type: tactic
facets:
  category:
  - tactic
difficulty:
review_status: approved
