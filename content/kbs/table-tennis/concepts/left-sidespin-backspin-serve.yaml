id: concept-left-sidespin-backspin-serve
slug: left-sidespin-backspin-serve
label: Left sidespin–backspin serve
aliases:
- left sidespin underspin serve
short_definition: A left-sidespin and backspin serve taught here with lateral
  force during the backswing and contact.
evidence_summary: >-
  One serving lesson directs force sideways during backswing and contact for both
  short and long sidespin-backspin serves, then recommends heavy spin, brushing and
  a floating ball. Its racket-angle cue is conditional on opponents who like to attack
  the backhand. In another lesson, the speaker calls elbow anchoring before a forearm
  snap a recent discovery for a spinnier left-sidespin/backspin serve. A separate
  part of that lesson describes a loose wrist shake, rather than forearm or upper-arm
  action, to make the ball float and curve; the wrist leads and fingers follow.
concept_type: serve
facets:
  category:
  - serve
  spin:
  - sidespin
  - backspin
difficulty:
review_status: approved
