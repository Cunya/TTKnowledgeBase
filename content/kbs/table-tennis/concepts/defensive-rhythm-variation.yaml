id: concept-defensive-rhythm-variation
slug: defensive-rhythm-variation
label: Changing rhythm against blocking and stepped-back defense
aliases:
- short loop then direct hit
- soft spin against stepped-back defense
short_definition: After a short loop, use a direct hit on the next ball rather than looping repeatedly. A separate example says that if the opponent steps back to defend, a soft ball with spin can hinder the counterloop; close-table blocking is a different case.
evidence_summary: >-
  One cue says to pause then loop; another follows a short first loop with a direct hit rather than another loop, warning that repeated looping can become passive. After a heavy-spin loop is blocked, the next hit makes the rhythm hard to follow. Against an opponent who steps back to defend, soft balls are troublesome if they carry spin; the passage distinguishes this from close-table blocking.
concept_type: tactic
