id: concept-block-forearm-angle
slug: block-forearm-angle
label: Block forearm angle
aliases:
- blocking triangle
short_definition: For fast balls, keep your hand in front and angle your forearm slightly.
evidence_summary: >-
  For fast balls, keep your hand in front and angle your forearm slightly. If your forearm is flat, you won't keep up with the speed. When blocking, we often miss the ball or get jammed. Aim your forearm diagonally forward.
concept_type: block-mechanic
facets:
