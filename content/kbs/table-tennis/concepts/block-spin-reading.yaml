id: concept-block-spin-reading
slug: block-spin-reading
label: Reading spin for the block
aliases:
- read spin for the block
- recognize a fake loop while blocking
short_definition: When blocking, read the opponent's motion to recognize a lifted fake loop with little spin before treating it as heavy spin.
evidence_summary: >-
  A player may hit the net after treating a fake loop with lift and little added spin as heavy spin. Read the opponent's motion to recognize the fake loop.
concept_type: perception
facets:
  category:
