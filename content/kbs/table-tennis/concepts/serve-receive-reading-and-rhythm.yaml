id: concept-serve-receive-reading-and-rhythm
slug: serve-receive-reading-and-rhythm
label: Serve and return preparation
aliases:
- serve-receive reading and rhythm
- receive rhythm matching
- early serve-spin judgment
short_definition: Preparation for serves and pushed returns combines early ball reading, contact positioning, rhythm matching and controlled hand tension.
evidence_summary: >-
  The main lesson sets the first server-side bounce as a spin-judgment deadline and matches stroke tempo to the time between bounces. It uses the speaker’s personal backhand contact standard and one-palm forehand spacing, and teaches a constant “50%” grip-pressure cue for soft receiving. Other examples read racket motion for spinny versus floated pushes and compare post-bounce speed in a short backspin/no-spin-ball example.
concept_type: receive-principle
facets:
  category:
  - receive
difficulty:
review_status: approved
