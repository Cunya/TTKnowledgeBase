id: concept-serve-receive-principles
slug: serve-receive-principles
label: Serve-receive principles
aliases:
- receive rhythm
- mirror principle
short_definition: Adapt receive timing, racket angle and force to the incoming
  serve and the ability to read its spin.
evidence_summary: >-
  One lesson matches receive rhythm to slow sidespin-backspin or fast serves. Another
  distinguishes constant speed when spin is unreadable from acceleration when it can
  be read. In separate heavy-spin examples, the speaker calls for concentrated, faster
  action rather than a slow stroke. Serve receive is also described as small and compact,
  with movement size, timing, angle and force differing from attack after one’s own
  serve.
concept_type: receive
facets:
  category:
  - receive
difficulty:
review_status: approved
