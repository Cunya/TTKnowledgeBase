short_definition: 'Start with pushing after serving. Once comfortable, practice slow heavy-spin loops with lower contact, then add explosive power loops once pushes are error-free and contact is solid.'
evidence_summary: >-
  After serving, begin with small-motion pushing, control the rhythm without rushing, and judge left and right. Once comfortable, lower the contact point and use slow heavy-spin loops without explosive power. When pushes are error-free and contact is solid, the coach permits explosive power loops. The stated sequence is push, spin loop, power loop; progressing too fast is warned against.
