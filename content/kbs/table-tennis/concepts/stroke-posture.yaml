detailed_definition: Stroke posture concerns torso, chest, shoulder and stance positioning during a stroke. In looping guidance, a speaker advises a forward center of gravity and a C-shape instead of an upright posture. Other examples use a slightly tucked chest for forward lean or compact movement, and a separate waist-tuck/core-engagement cue for a stiff-back example. Shoulder-rotation advice for looping topspin or backspin presses the shoulder downward rather than rotating flat. Another cue lowers the center of gravity into a forward-reaching lunge when looping topspin or backspin.
