id: concept-backhand-topspin-against-backspin
slug: backhand-topspin-against-backspin
label: Backhand topspin against backspin
aliases:
- backhand loop underspin
short_definition: For a backhand loop against backspin, drop the racket head and brush the ball to lift it.
evidence_summary: >-
  For a backhand loop against backspin, drop the racket head and brush the ball to lift it. The lesson describes lifting the arm and racket from low to high as producing no real friction. During practice, tilt your center of gravity a bit. Against very strong backspin, make the motion smaller and increase upward frequency and speed; against weaker spin, brush more gradually.
concept_type: stroke-variation
facets:
  category:
  - stroke
  side:
  - backhand
difficulty:
review_status: approved
