id: concept-spin-loop-vs-power-loop
slug: spin-loop-vs-power-loop
label: Loop choices and drive differences
aliases:
- spin loop versus power loop
- high-arc loop
- power loop selection
- loop versus drive
short_definition: Spin and power loops differ in safety, contact height and timing; a loop also follows a different path from a drive.
evidence_summary: >-
  For a difficult ball or a poor opportunity, one lesson keeps the racket facing the ball near the outside of the right knee; a good opportunity allows pulling back behind the hip. A separate lesson uses body power on a lighter-spin ball and lists peak timing, pressing and closing, forward drive and a compact body for a power loop. Against heavy spin, another recommends looping with arc first, getting the ball on the table before deciding. The drive comparison describes a loop’s outer-arc path and rejects treating it as a drive with a bigger motion.
detailed_definition: "One lesson calls a high-arc loop a power loop with added safety. Contact-height guidance keeps brush contact roughly level with the table and raises it for a forward power loop. Another lesson assigns brushing to arc height and forward drive to arc depth. Timing guidance places power loops and kill shots at the peak and spin loops in the early descending phase."
concept_type: tactic
facets:
  category:
  - stroke-selection
  - consistency
difficulty:
review_status: approved
