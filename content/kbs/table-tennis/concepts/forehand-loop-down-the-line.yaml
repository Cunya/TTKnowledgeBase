id: concept-forehand-loop-down-the-line
slug: forehand-loop-down-the-line
label: Loop placement and rhythm
aliases: []
short_definition: Choosing loop direction and timing, with down-the-line technique, placement-first tactics and intention-based training examples.
evidence_summary: >-
  The down-the-line lesson uses earlier timing than crosscourt, minimal backswing, a slightly outward racket face and forward forearm drive. Against a blocker, it changes placement before spin and speed, then power. Another cue waits after the opponent’s push and strikes suddenly. A training example gives the intended action a command when intent disrupts the stroke. A separate placement rule goes crosscourt if the opponent stays still after pushing and down the line if they anticipate crosscourt.
concept_type: stroke-variation
facets:
  category:
  - stroke
difficulty:
review_status: approved
