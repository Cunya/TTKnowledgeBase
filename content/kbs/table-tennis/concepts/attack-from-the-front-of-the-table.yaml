evidence_summary: >-
  Attack from the front of the table brings together several connected ideas. To avoid stepping
  back, attack from the front of the table, and keep a forward position for aggressive play. After
  serving short and the opponent steps in, the attacker can then play a long ball. Moving the body
  and racket into position immediately after serve and recovering for a close-table
