  with a quick-counter, close-range game and offensive pressure. Staying extremely close to the
  ball/table, playing up front, and using the reduced distance to maximize speed. To transition
  directly from the high ready position to attack, recover above the table, and attack directly
  from the ready position. Together, these principles show how the topic is applied in practice
  while preserving the relevant distinctions and constraints.
