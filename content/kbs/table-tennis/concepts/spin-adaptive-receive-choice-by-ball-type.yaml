short_definition: For a heavily spinning serve, try contacting the side of the ball; a direct fast push can lead you to misread the spin. With little or no spin, push the back of the ball. Against a short serve with weak spin, this can be a fast long push. With more spin, use a side push or side cut to avoid the strongest part of the spin.
