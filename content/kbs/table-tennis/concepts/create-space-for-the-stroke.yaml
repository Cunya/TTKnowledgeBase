short_definition: Maintain enough room after serve or during movement so the swing can be completed freely without getting jammed.
evidence_summary: >-
  Create space for the stroke brings together several connected ideas. The first key after serve
  is having enough space, and standing too close jams the stroke and forces a block. Needing
  distance and proper positioning to avoid jams and complete the backswing and body rotation. A
  kill shot requires more space, and that a bigger backswing and more body rotation are used to
  create it. A preferred distance from the table and being too close causes jamming. Stepping back
  gives enough space for a full backswing and more complex loop motion. Body rotation creates
  space, keeps the contact point in front, and prevents jamming that occurs when the hand is
  pulled back. The forehand has more space, while the backhand has limited space and requires more
  precision. The space for the backhand is of utmost importance and that you must find the right
  sense of space between hand and body. Together, these principles show how the topic is applied
  in practice while preserving the relevant distinctions and constraints.
