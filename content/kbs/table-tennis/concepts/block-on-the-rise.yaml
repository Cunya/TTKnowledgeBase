id: concept-block-on-the-rise
slug: block-on-the-rise
label: Block on the rise
aliases:
- early block timing
short_definition: The speaker says, “Only by taking it at the rising phase can I block it.”
evidence_summary: >-
  The speaker says timing is the first issue when defending: at the peak, the ball may go long, while at the rising phase it will stay on. He says blocking and short push rely on taking the ball early. For curving balls, he advises no big backswing and taking the ball on the rise; at the peak or descent, he warns, you’ll miss as the ball curves away.
concept_type: timing
facets:
  category:
  - stroke
difficulty:
review_status: approved
