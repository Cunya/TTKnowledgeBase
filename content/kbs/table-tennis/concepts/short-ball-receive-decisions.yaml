id: concept-short-ball-receive-decisions
slug: short-ball-receive-decisions
label: Short-ball receive decisions
aliases:
- short-return stroke selection
- short-ball receive options
short_definition: Choose a push, flick or loop according to the ball’s length,
  height and spin; read its position before stepping in.
evidence_summary: >-
  One lesson recommends a flick for a high ball with two bounces on the table. Another
  contrasts banana-flick space on short and half-long balls with blocking or looping
  in front against long serves. A spin-selection lesson favors flicking topspin serves
  and long or heavy-spin pushes against backspin. Read the ball during the turn and
  choose the foot adjustment for its length.
concept_type: decision-framework
facets:
  category:
  - receive
  - strategy
difficulty:
review_status: approved
