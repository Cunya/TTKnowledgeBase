short_definition: 'The speaker varies the recovery stance with serve spin and the planned attack: after a heavy-spin serve, if planning a backhand loop, use a square stance, even with the right foot slightly forward. After a low-spin serve, use a side-on stance ready to step around and attack. Avoid using the same recovery stance for every serve.'
