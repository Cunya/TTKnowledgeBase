id: concept-direction-reading
slug: direction-reading
label: Reading the opponent and ball
aliases:
- direction reading
- ball tracking
- read before committing
short_definition: Reading the opponent’s action and the incoming ball before committing to a response.
evidence_summary: >-
  The lessons connect observation with stroke choice and preparation. One warns against drawing back before reading the opponent’s action. Another starts movement when the opponent commits to a stroke direction, with adjustments for wide and narrow angles. Ball-tracking instruction follows the trajectory from racket to racket. Serve-return examples compare the spin expected after spin and no-spin serves and call for a corresponding looping method. A separate cue reads the landing point and trajectory before the body rises.
concept_type: perception
facets:
  category:
  - fundamentals
difficulty:
review_status: approved
