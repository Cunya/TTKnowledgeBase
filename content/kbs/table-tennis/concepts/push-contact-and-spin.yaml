id: concept-push-contact-and-spin
slug: push-contact-and-spin
label: Push contact and spin
aliases:
- spinny push
- push racket contact
short_definition: Push-contact cues include bottom-half racket contact and pushing behind the ball; a heavy-spin push cue calls for fast racket-head rotation at contact.
evidence_summary: >-
  One lesson uses bottom-half racket contact and a small wrist-and-finger action, then adds a little forearm power for speed. A second emphasizes finger control rather than using the arm to feel the ball. Another lesson uses behind-ball contact and a slightly-lower adjustment when repeated netting is attributed to heavier-than-expected spin. The heavy-spin push lesson emphasizes fast racket-head rotation and snap at contact.
concept_type: push-mechanic
facets:
  category:
  - stroke
difficulty:
review_status: approved
