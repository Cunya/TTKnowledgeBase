id: concept-forehand-drive
slug: forehand-drive
label: Forehand drive
aliases:
- drive hit
short_definition: A forehand impact stroke with a short takeback-to-contact distance, described in the lessons with peak-bounce timing and forward arm movement.
evidence_summary: >-
  Lessons describe a short takeback-to-contact distance, peak-bounce timing and a backswing at the side rather than behind the body. A drive-versus-loop comparison uses a small forearm-led framework close to the table and a locked wrist for hitting. Another cue moves the arm structure forward with the body, while a half-long-ball example keeps the elbow outside and pointing down. A personal distance scale starts the forward swing when the ball reaches position eight out of ten; a separate shoulder cue keeps the shoulder stable as the upper arm and forearm move forward.
concept_type: stroke
facets:
  category:
  - stroke
  side:
  - forehand
difficulty:
review_status: approved
