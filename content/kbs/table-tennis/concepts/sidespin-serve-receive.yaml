id: concept-sidespin-serve-receive
slug: sidespin-serve-receive
label: Receive sidespin serves
aliases:
- sidespin-topspin receive
short_definition: Receiving sidespin-topspin with compact, low-force touches and sidespin-backspin with brushing and a backswing below the ball.
evidence_summary: >-
  For sidespin-topspin, one lesson recommends no backswing, pressing the racket angle down, a small motion with little force and a quick touch rather than a forward push. It also calls for varied placement. A sidespin-backspin lesson emphasizes brushing, completing the stroke quickly, dropping weight and preparing below the ball, especially with heavier spin.
concept_type: receive
facets:
  category:
  - receive
difficulty:
review_status: approved
