    excerpt: The biggest threat from the second push comes from the racket head. If you only use your forearm, the ball will feel slow and lack a second acceleration. Therefore, after you send the ball with your forearm, the racket head must accelerate towards the table. If your follow-through stops, the ball will have some spin but no speed. For both shakehand and penhold, your racket head must face the table after the push.
