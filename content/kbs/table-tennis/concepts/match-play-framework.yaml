id: concept-match-play-framework
slug: match-play-framework
label: Match-play framework
aliases:
- match phases
- match mindset
short_definition: Source-specific ways to organize match mindset, phases of play, score-dependent choices and responses to incoming spin.
evidence_summary: >-
  One lesson promotes a mindset aimed at winning and divides play into serve plus third-ball attack, receive and its transition, and rallies. It calls for identifying a weak area and focusing on one aspect. Another lesson avoids going all out at the start, seeks touch and rhythm, and varies impact versus brushing with confidence and critical points. A separate lesson categorizes incoming spin, giving its own brush/impact proportions and different responses for heavy, normal and light topspin.
concept_type: strategy
facets:
  category:
  - strategy
difficulty:
review_status: approved
