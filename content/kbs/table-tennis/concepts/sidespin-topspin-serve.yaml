id: concept-sidespin-topspin-serve
slug: sidespin-topspin-serve
label: Sidespin–topspin serve
aliases:
- side-top serve
- sidespin topspin service
short_definition: Sidespin–topspin serve cues include speed, forward contact and variations in brushing along a circular serving path.
evidence_summary: >-
  One lesson recommends sidespin–topspin for long-serve attack rhythm because the return cannot carry much backspin. Another describes a fast, strong-spin serve that makes forceful returns go long and draws a passive block. A brush-timing lesson says sidespin–topspin and sidespin–backspin trace the same circular path, with the brush applied at different points. A contact lesson specifies a vertical paddle moving forward and warns that bottom contact adds a backspin element.
concept_type: serve
facets:
  category:
  - stroke
  - tactic
  spin:
  - sidespin
  - topspin
difficulty:
review_status: approved
