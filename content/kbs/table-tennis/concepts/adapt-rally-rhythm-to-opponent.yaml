id: concept-adapt-rally-rhythm-to-opponent
slug: adapt-rally-rhythm-to-opponent
label: Adapt rally rhythm to the opponent
aliases:
- match the opponent’s rhythm
short_definition: Match your rhythm to the opponent’s tempo, going faster with fast balls and slower with slow balls.
evidence_summary: >-
  Match stroke and backswing rhythm to the opponent’s, going fast when it is fast and slow when it is slow; avoid rushing the backswing. Against penhold pressure, use compact, short contact, since a full stroke can let the opponent borrow spin and return it heavier.
detailed_definition: 'Match your stroke and backswing rhythm to the opponent’s: go fast when it is fast and slow when it is slow, without rushing the backswing. Against penhold pressure, use compact, short contact; a full stroke can let the opponent borrow your spin and return it heavier.'
concept_type: strategy
facets:
  category:
  - tactic
  side:
  - neutral
difficulty:
review_status: approved
