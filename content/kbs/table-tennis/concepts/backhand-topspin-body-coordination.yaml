aliases:
- backhand stance and mechanics
- backhand body mechanics
- backhand coil and thrust
concept_type: principle
detailed_definition: For a strong backhand, keep the right foot from falling too far behind the left and keep the feet nearly level; the speaker recommends standing square at minimum and says he usually places his right foot slightly forward in rallies. Open the hips and keep the backswing inside the body line. For a backhand attack, coil inward with the backswing and drive forward by thrusting the abdomen. The speaker describes abdominal contraction and expansion as central to his own stroke, says core engagement synchronizes arm and body movement, and summarizes a backhand drive as a “coil and thrust” of the core.
difficulty: null
