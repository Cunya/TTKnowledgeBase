id: concept-backhand-swing-arc-spacing
slug: backhand-swing-arc-spacing
label: Creating space for the backhand
aliases:
- backhand working room
short_definition: Leave space for the backswing and avoid standing too close to the ball.
evidence_summary: >-
  Keep your body from getting too close to the ball. In an example, the speaker says the right hand can feel too near and restricted during a forward push, and suggests moving the point of contact slightly farther from the body horizontally. Keep roughly one racket length between the peak of the bounce and the forward swing. For a backhand attack, keep the racket about a forearm’s length from the body. If the ball stays far from the body during the backhand backswing, contact may occur only at the end of the stroke.
detailed_definition: Keep your body from getting too close to the ball. In an example, the speaker says the right hand can feel too near and restricted during a forward push, and suggests moving the point of contact slightly farther from the body horizontally. Keep roughly one racket length between the peak of the bounce and the forward swing; too little distance limits forward momentum. For a backhand attack, keep the racket about a forearm’s length from the body. If the ball stays far from the body during the backhand backswing, contact may occur only at the end of the stroke.
concept_type: positioning
facets:
  category:
  - fundamentals
  - stroke
  side:
  - backhand
difficulty:
review_status: approved
