id: concept-racket-contact-constraint-drill
slug: racket-contact-constraint-drill
label: Racket-contact constraint drill
aliases:
- racket-half drill
short_definition: Restrict half of the racket during practice to expose contact-height errors. For pushing, block the top half and use the bottom; for looping, cover the bottom half and use contact feedback to adjust.
evidence_summary: >-
  For push practice, block the top half of the racket and use the bottom half. If the top half is struck by mistake, adjust the hand position higher next time. For looping, cover the bottom half; hitting the hand indicates contact was too low and needs adjustment.
concept_type: drill
