id: concept-serve-and-attack-patterns
slug: serve-and-attack-patterns
label: Serve and opening-attack patterns
aliases:
- serve and attack sequence
- spin-spin-kill pattern
short_definition: Connecting serves or push placements with the following attack, using source-specific point patterns.
evidence_summary: >-
  One lesson connects serve and attack as a continuous sequence. Its heavy-spin branch uses a heavy-spin serve, heavy-spin third ball and power fifth ball, with enough serve spin to force a push. Its dead- or light-spin branch finishes immediately if the pushed return rises. After a dead serve and high push, the lesson adds footwork and focus to move in. A separate placement example pushes short to the forehand then loops deep to the backhand, or pushes to the backhand then soft-loops to the forehand without maximum power.
concept_type: tactical-pattern
facets:
  category:
  - strategy
  - serve
difficulty:
review_status: approved
