id: concept-third-ball-adjustment
slug: third-ball-adjustment
label: Third-ball adjustment
aliases:
- serve follow-up
- serve plus one adjustment
short_definition: Adjust the third-ball attack to the serve’s spin and the
  actual return, including when to start the backswing.
evidence_summary: >-
  One lesson chooses half-spin or no-spin serves when seeking a moderate-spin return
  that can be power-looped. Another says a heavy-spin serve mainly calls for a high-arc
  spinny loop, while half-spin or no-spin permits a forward loop; if the receiver
  adds spin, treat the return as heavy spin. A timing lesson recommends waiting until
  the return crosses the net before backswing and release in one motion, while describing
  an early backswing plus a full-beat pause as the alternative.
concept_type: strategy
facets:
  category:
  - tactic
difficulty:
review_status: approved
