id: concept-push-variations
slug: push-variations
label: Push variations
aliases:
- adaptive pushing
- fast push
- floating push
- flat push
short_definition: Push choices adjust speed, spin, timing and contact to the opponent and the incoming serve.
evidence_summary: >-
  One lesson uses default push modes for uncertain serves but recommends attacking a dead serve. Its introductory pairing is a dead push for a spin-loving looper and a heavy push for a power looper; other examples adapt to swing style and timing. Fast pushes borrow incoming speed on the rise, flat pushes use a locked wrist without brushing, and slow floating pushes use side brushing for drift against rushers. A separate lesson uses a smooth, even pace for a very spinny serve and accelerates on weak spin.
concept_type: stroke-variation
facets:
  category:
  - stroke
  - receive
difficulty:
review_status: approved
