id: concept-backhand-loop
slug: backhand-loop
label: Backhand loop
aliases:
- backhand topspin loop
short_definition: A backhand loop uses an arcing brush and racket-head rotation to transfer power.
evidence_summary: >-
  Bring the ball into the body before looping and move the body during the backswing. Control the racket head through setting, lifting and rotating; relax, create an arc to brush the ball, then rotate to transfer power. Against backspin, get low and stay down; avoid a stance with the left foot forward and the right foot back together.
concept_type: stroke
facets:
  category:
  - stroke
  side:
  - backhand
difficulty:
review_status: approved
