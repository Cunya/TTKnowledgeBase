id: concept-serve-planning
slug: serve-planning
label: Serve planning
aliases:
- serve plan by game
- serve sequence planning
short_definition: Planning a serve mix and developing repeatable serve-and-follow-up patterns, with source-specific examples of spin choices, own strengths, and readiness for either flank.
evidence_summary: >-
  For an example 11-point game, the speaker asks players to plan their six-to-eight serves and the mix of backspin and topspin. A short serve to the forehand can develop into a go-to pattern: if the opponent pushes, the speaker gradually follows with a loop. Know your own strengths, while recognizing that a strength may not be the opponent’s weakness. In another video, the speaker recommends both flanks and describes personal readiness: loading forehand after a “dead” serve, but staying square and ready on both sides after heavy spin.
concept_type: strategy
facets:
  category:
  - strategy
difficulty:
review_status: approved
