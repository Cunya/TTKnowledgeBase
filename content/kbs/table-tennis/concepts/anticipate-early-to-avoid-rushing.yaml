short_definition: Prepare for the ball in advance so you do not rush your movement or stroke timing.
evidence_summary: >-
  Anticipate early to avoid rushing brings together several connected ideas. Rushing happens
  because the player did not anticipate in advance. Elite players rise before contact because they
  anticipate the spin and shying away slows reactions and anticipation. Return difficulty comes
  from not anticipating, and explicitly tells players to practice anticipation and train it
  seriously. Rushing as a major error and the split second between strokes should be used to
  adjust body, position, and rhythm. Players rush unnecessarily, especially against backspin, even
  though there is enough time. He advises not starting the backswing until the ball is there,
  watching the trajectory, and waiting a moment to relax. Three principles and each one with
  examples. A useful contrast is between being late and rushing and states that rushing comes from
  poor recovery. Additional points reinforce the same theme. Together, these principles show how
  the topic is applied in practice while preserving the relevant distinctions and constraints.
