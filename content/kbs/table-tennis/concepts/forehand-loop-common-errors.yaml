id: concept-forehand-loop-common-errors
slug: forehand-loop-common-errors
label: Forehand loop common errors
aliases: [loop corrections, push-brush error, vertical brushing error]
short_definition: Source-described loop errors include pushing before brushing, rotating the wrist without forward movement, unstable racket-face contact, an oversized swing, and excessive upward forearm force.
evidence_summary: >-
  The examples describe a push-first action leaving no time to brush, wrist rotation in place failing to send the ball over, and going long with excessive upper-arm use, unstable contact, an oversized swing or too much upward forearm force. Corrections include brushing over the ball and forward-and-upward forearm movement. A high arc alone is not called the problem in one lesson; adding power with that same high-arcing swing is.
detailed_definition: The cited corrections describe wrapping and brushing rather than pushing first, brushing over the ball, and combining spin generation with forward movement. They also address unstable wrist or racket-face contact and an overly large or upward swing. One lesson explicitly distinguishes a high arc alone from the problem of adding power with that same high-arcing swing.
concept_type: troubleshooting
facets:
  category:
  - error-correction
  - stroke
  side:
  - forehand
  spin:
  - topspin
difficulty:
review_status: approved
