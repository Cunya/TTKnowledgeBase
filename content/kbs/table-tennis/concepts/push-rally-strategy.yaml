id: concept-push-rally-strategy
slug: push-rally-strategy
label: Push-rally strategy
aliases:
- push-to-attack strategy
- push rally planning
short_definition: Push-rally planning coordinates recovery, push quality, placement and rhythm, reading the return, and deciding whether to attack or defend.
evidence_summary: >-
  One lesson combines recovery after every push with a low, deep push that is not too spinny. It varies placement and rhythm so the attack differs from the push, and distinguishes a clear attack decision from pushing steadily to set up defense. Its deceptive-return example asks the player to read spin versus carry from the opponent’s stroke. Another lesson varies depth, including drop-short and one- or two-bounce options, to bring the opponent in before looping the next ball.
concept_type: tactical-pattern
facets:
  category:
  - strategy
  - stroke
difficulty:
review_status: approved
