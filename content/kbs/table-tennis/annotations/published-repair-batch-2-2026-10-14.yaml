  - concept_id: concept-body-hand-synchronization
    previous_summary: >-
      Good stroke production depends on the body and arm moving together rather than in separate
      pieces. The lower body, torso, arm, wrist, and fingers should link into one coordinated sequence
      so the motion feels connected from the ground up. When timing is correct, footwork and hand
      action reinforce each other and create cleaner acceleration through the ball.
    previous_generator: "codex"
    previous_source_hash: "sha256:4e61fd56bd3f7d75ab261845008bf4eb648ce7351afcdb7bde7c0710d0d66dad"
  - concept_id: concept-serve-receive-principles
    previous_summary: >-
      Good serve receive begins with judging the quality and speed of the incoming serve, then
      matching tempo to it with small, rhythmic movements rather than large swings. Slower or softer
      serves call for a slower rhythm, while quicker serves require a faster one, and the receiver
      should borrow, add, or redirect power with the body leading instead of forcing the ball. When
      the serve is uncertain, a neutral receive that starts more vertically and then flattens toward
      the centerline is a safe default, and training should still include attacking receives even at
      the cost of short-term errors.
    previous_generator: "codex"
    previous_source_hash: "sha256:19576f4dce0b4774af15b500df5e7e8e98d2308c37f044d08f192086084c43d1"
  - concept_id: concept-contact-point
    previous_summary: >-
      Good shot quality depends on finding the correct contact point on the ball at the right phase of
      its bounce cycle. Contact should be made on the intended part of the ball, not the side, and the
      player must stay with the contact point by creating space for it instead of losing it through
      poor movement. If the contact point is misread or the body moves away from it, the shot becomes
      unstable and the ball is struck at the wrong moment or position.
    previous_generator: "codex"
    previous_source_hash: "sha256:739577c6cfdfcd954f7d281d6153b651cfff64373db55abe2e836578c0aac4d1"
  - concept_id: concept-contact-zone-on-ball
    previous_summary: >-
      Different contact zones on the ball produce different outcomes, so the impact point must match
      the intended shot. Higher contact on the ball generally supports more brushing, stronger arc,
      and more spin, while lower or center contact is better for flatter, more direct hitting. The
      racket and hand must align so the stroke reaches the right zone at contact, with the body,
      forearm, fingers, and wrist all contributing at that moment.
    previous_generator: "codex"
