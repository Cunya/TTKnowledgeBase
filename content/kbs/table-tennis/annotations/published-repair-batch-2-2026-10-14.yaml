article_changes:
  - concept_id: concept-post-serve-recovery
    previous_summary: >-
      After serving, the player should recover immediately into a close, ready position instead of
      retreating backward. On a long serve, quick recovery prevents scrambling for the next ball,
      while on a short serve the server must finish the arc and placement control before moving back
      into position. The core idea is that early recovery preserves table proximity and prevents the
      feeling of being jammed by the opponent’s return.
    previous_generator: "codex"
    previous_source_hash: "sha256:ba7ff903c6054e4d9956d54683b80327bb8e55b33df06e2160a53fdbb5ccde9b"
  - concept_id: concept-push-technique
    previous_summary: >-
      A good push uses a slightly upright racket angle, compact forward-and-slightly-downward motion,
      and firm contact under or behind the ball. The stroke should be placement-first and controlled,
      with body weight and a concise action creating the main effect rather than a loose wrist or
      overly flat face. Because the push is a high-frequency match shot, it must be treated seriously
      and executed with consistency, spin, and enough compact force to be effective.
    previous_generator: "codex"
    previous_source_hash: "sha256:bfb0d9ade12ab92d4adfbc49a02f784bbea00e0f864f20d7c9c24ca9f00e1a6f"
  - concept_id: concept-forehand-loop
    previous_summary: >-
      The forehand loop is an attacking stroke that uses a forward-upward swing with a brushing
      contact to create topspin while still driving through the ball. Its power comes from late
      acceleration and a contact point chosen to match the incoming spin and height, so a loop against
      backspin requires more brushing and a loop against topspin needs a balanced mix of impact and
      brush. For beginners, the key is to feel the ball cleanly at contact and to distinguish looping
      from driving, since the loop depends on generating spin as well as speed.
    previous_generator: "codex"
