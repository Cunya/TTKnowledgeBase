article_changes:
  - concept_id: concept-backhand-rip-practice-progression
    previous_summary: >-
      Training for the backhand rip should start with relaxed brushing and trajectory creation, then
      gradually add speed, forearm involvement, grip firmness, and power. A useful progression
      isolates the upper arm and forearm so the player can feel racket-head speed coming mainly from
      wrist action, then reuse that whip for different spins. Another step is to temporarily ignore
      whether the ball lands and exaggerate loose acceleration so the feeling of power comes first,
      with control added back afterward.
    previous_generator: codex
    previous_source_hash: sha256:51ac66f16d8809861a76c1060b0bd98b7a6b58966793a8976317e937a5524d2a
  - concept_id: concept-backhand-rip-backswing
    previous_summary: >-
      The backhand rip begins from a slightly lower backswing than a backhand drive, usually around
      the lower abdomen, but it should stay compact and never drop so far that it becomes a looping
      action. For stronger topspin, the racket face starts closed and the ball is treated as if it
      stays underneath the racket before release, which preserves the friction-oriented shape of the
      stroke.
    previous_generator: codex
    previous_source_hash: sha256:bfaef38180c9c52205b1bfdc9e4e5ffe13242b817d06c04e8e7c2bc089b2a3ee
  - concept_id: concept-backhand-serve
    previous_summary: >-
      The backhand serve is presented as easy to learn but difficult to judge well, because its
      effectiveness depends on how cleanly the racket wraps the ball rather than on a simple forward
      hit. Spin comes mainly from lateral friction, so the toss should be to the left side near the
      left hip and contact should happen early before the arm extends past the ball; a loose, lively
      grip helps the racket head whip and produce more rotation. Deception comes from making different
      spins look the same in preparation and motion, so variation in setup is a major part of the
      serve's value.
    previous_generator: codex
    previous_source_hash: sha256:fc41be6ec9d3aaf8ee063ef12cf7339f08427144165fdb8a28ebdc3635469d74
  - concept_id: concept-backhand-swing-arc-spacing
    previous_summary: >-
      Good backhand mechanics depend on creating enough space between the body and the ball, since a
      cramped stroke limits forward acceleration and power. The player should move slightly backward
      and lower the hand to open room, while still bringing the ball into a workable hitting zone that
      is not so close that there is no space to swing. This spacing is managed more by the forearm
      than by the elbow, and it helps the backhand flick and other strokes feel freer and more
      powerful.
    previous_generator: codex
    previous_source_hash: sha256:6f7d812f375e1dc8c49d8eab8cabafa7308a78093112e02833dcc19ebcc51aaa
